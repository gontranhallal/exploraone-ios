name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Tuist via Homebrew
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1" # Bypass para evitar que Homebrew detenga la instalacion
        run: |
          brew install tuist

      - name: Generate Xcode Project with Tuist
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          tuist generate

      - name: Find Workspace and Build
        run: |
          WORKSPACE=$(find . -name "*.xcworkspace" -o -name "*.swiftworkspace" | head -n 1)
          echo "Workspace generado en ruta: $WORKSPACE"
          
          if [ -z "$WORKSPACE" ]; then
            echo "Error critico: No se pudo generar el espacio de trabajo de Xcode tras correr Tuist."
            exit 1
          fi
          
          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$XCODEPROJ" | grep -A 10 "Schemes:" | tail -n +2 | xargs | awk '{print $1}')
          echo "Esquema detectado automaticamente: $SCHEME"
          
          if [ -z "$SCHEME" ]; then
            SCHEME="App"
          fi
          
          xcodebuild -workspace "$WORKSPACE" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -archivePath $HOME/build/App.xcarchive \
                     clean archive \
                     CODE_SIGNING_ALLOWED=NO

      - name: Export Unsigned IPA
        run: |
          mkdir -p payload/Payload
          cp -r $HOME/build/App.xcarchive/Products/Applications/*.app payload/Payload/
          cd payload
          zip -r ../App-Unsigned.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Unsigned-IPA
          path: App-Unsigned.ipa
