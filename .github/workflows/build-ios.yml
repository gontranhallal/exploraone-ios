name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Tuist via Homebrew
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          brew install tuist

      - name: Resolve Dependencies with Tuist
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          tuist install

      - name: Find Workspace and Build
        run: |
          WORKSPACE=$(find . -name "*.xcworkspace" -o -name "*.swiftworkspace" | head -n 1)
          echo "Workspace localizado en ruta: $WORKSPACE"
          
          if [ -z "$WORKSPACE" ]; then
            echo "Error critico: No se localizo el espacio de trabajo."
            exit 1
          fi
          
          # Listamos los schemes del workspace y tomamos el primero que no sea una dependencia del sistema
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | grep -A 20 "Schemes:" | tail -n +2 | xargs | awk '{print $1}')
          echo "Esquema (Scheme) detectado automaticamente en el Workspace: $SCHEME"
          
          if [ -z "$SCHEME" ] || [ "$SCHEME" = "Loading..." ]; then
            SCHEME="App"
            echo "No se pudo extraer de forma limpia, intentando con el valor por defecto: App"
          fi
          
          xcodebuild -workspace "$WORKSPACE" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -archivePath $HOME/build/App.xcarchive \
                     clean archive \
                     CODE_SIGNING_ALLOWED=NO

      - name: Export Unsigned IPA
        run: |
          mkdir -p payload/Payload
          cp -r $HOME/build/App.xcarchive/Products/Applications/*.app payload/Payload/
          cd payload
          zip -r ../App-Unsigned.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Unsigned-IPA
          path: App-Unsigned.ipa
