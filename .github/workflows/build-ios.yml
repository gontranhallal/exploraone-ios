name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Tuist via Homebrew
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          brew install tuist

      - name: Resolve Dependencies with Tuist
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          tuist install

      - name: Compile Project with Tuist
        run: |
          # Compilamos en modo Release usando el motor nativo de Tuist
          tuist build --configuration Release

      - name: Export Unsigned IPA
        run: |
          # Buscamos la aplicacion compilada (.app) en el directorio de salida de Tuist y Xcode
          APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData -name "*.app" | grep -v "Index.noindex" | head -n 1)
          echo "Aplicacion localizada en: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            # Si no esta en la ruta global por defecto, buscamos localmente
            APP_PATH=$(find . -name "*.app" | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: No se pudo localizar el binario compilado .app"
            exit 1
          fi
          
          mkdir -p payload/Payload
          cp -r "$APP_PATH" payload/Payload/
          cd payload
          zip -r ../App-Unsigned.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Unsigned-IPA
          path: App-Unsigned.ipa
