name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Find Workspace and Build
        run: |
          # Búsqueda profunda en todo el repositorio para localizar el workspace
          WORKSPACE=$(find . -name "*.xcworkspace" -o -name "*.swiftworkspace" | head -n 1)
          echo "Workspace encontrado en ruta: $WORKSPACE"
          
          if [ -z "$WORKSPACE" ]; then
            echo "Error critico: No se encontro ningun archivo .xcworkspace o .swiftworkspace en todo el repositorio."
            echo "Asegurate de haber subido la carpeta completa que te dio Median."
            exit 1
          fi
          
          # Buscamos de forma automatica el archivo de esquema (.xcodeproj) para extraer su nombre
          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$XCODEPROJ" | grep -A 10 "Schemes:" | tail -n +2 | xargs | awk '{print $1}')
          echo "Esquema (Scheme) detectado automaticamente: $SCHEME"
          
          if [ -z "$SCHEME" ]; then
            SCHEME="App"
            echo "No se detecto esquema, usando el valor por defecto: App"
          fi
          
          xcodebuild -workspace "$WORKSPACE" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -archivePath $HOME/build/App.xcarchive \
                     clean archive \
                     CODE_SIGNING_ALLOWED=NO

      - name: Export Unsigned IPA
        run: |
          mkdir -p payload/Payload
          cp -r $HOME/build/App.xcarchive/Products/Applications/*.app payload/Payload/
          cd payload
          zip -r ../App-Unsigned.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Unsigned-IPA
          path: App-Unsigned.ipa
