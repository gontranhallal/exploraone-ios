name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Find Workspace and Build
        run: |
          WORKSPACE=$(find . -name "*.xcworkspace" -o -name "*.swiftworkspace" | head -n 1)
          echo "Workspace encontrado: $WORKSPACE"
          
          if [ -z "$WORKSPACE" ]; then
            echo "No se encontro ningun workspace (.xcworkspace o .swiftworkspace)"
            exit 1
          fi
          
          xcodebuild -workspace "$WORKSPACE" \
                     -scheme App \
                     -configuration Release \
                     -archivePath $HOME/build/App.xcarchive \
                     clean archive \
                     CODE_SIGNING_ALLOWED=NO

      - name: Export Unsigned IPA
        run: |
          mkdir -p payload/Payload
          cp -r $HOME/build/App.xcarchive/Products/Applications/*.app payload/Payload/
          cd payload
          zip -r ../App-Unsigned.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/artifacts/upload-artifact@v4
        with:
          name: App-Unsigned-IPA
          path: App-Unsigned.ipa
